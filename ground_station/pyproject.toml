[project]
name = "samwise-ground-station"
version = "1.0.0"
description = "LoRa ground station for Samwise CubeSat communication"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Stanford SSI", email = "ssi@lists.stanford.edu"}
]
keywords = ["cubesat", "lora", "ground-station", "satellite", "communication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Aerospace",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "adafruit-circuitpython-rfm9x",
    "adafruit-circuitpython-hashlib",
    "circuitpython-hmac",
    "adafruit-blinka",
    "pydantic>=2.0.0",
    "rpi-lgpio>=0.6; platform_machine == 'aarch64' and sys_platform == 'linux'",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "starlette",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=26.0.0",
    "ruff>=0.15.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/stanford-ssi/samwise-flight-software"
Repository = "https://github.com/stanford-ssi/samwise-flight-software"
Issues = "https://github.com/stanford-ssi/samwise-flight-software/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]

markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "compatibility: Platform compatibility tests (CPython vs CircuitPython)",
    "protocol: Protocol encoding/decoding tests",
    "filtering: Packet filtering tests",
    "server: FastAPI server and WebSocket tests",
]

minversion = "7.0"

[tool.coverage.run]
source = ["ground_station"]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py313']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | lib
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "lib",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ground_station"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"ground_station/models/*.py" = ["N815", "N803"]
"tests/test_compatibility.py" = ["N806", "E712"]
