name: Ground Station Tests

on:
  push:
    branches:
      - main
    paths:
      - 'ground_station/**'
      - '.github/workflows/ground-station-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ground_station == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ground_station:
              - 'ground_station/**'
              - '.github/workflows/ground-station-tests.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Test Ground Station (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: ground_station/pyproject.toml

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblgpio-dev lgpio

    - name: Install dependencies
      run: uv pip install --system -e ground_station/[test]

    - name: Run tests with pytest
      run: |
        cd ground_station
        uv run --no-project python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        files: ./ground_station/coverage.xml
        flags: ground-station
        name: ground-station-coverage
        fail_ci_if_error: false

  test-compatibility:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Platform Compatibility Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: ground_station/pyproject.toml

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Install dependencies
      run: uv pip install --system -e ground_station/[test]

    - name: Run compatibility tests
      run: |
        cd ground_station
        uv run --no-project python -m pytest tests/test_compatibility.py -v

    - name: Run filtering tests
      run: |
        cd ground_station
        uv run --no-project python -m pytest tests/test_filtering.py -v

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Lint Ground Station Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Install linting tools
      run: uv pip install --system "black==24.1.1" "ruff==0.2.1"

    - name: Check code formatting with black
      run: |
        cd ground_station
        black --check --diff .

    - name: Lint with ruff
      run: |
        cd ground_station
        ruff check .
