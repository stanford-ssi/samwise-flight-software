name: Ground Station Tests

on:
  push:
    branches:
      - main
    paths:
      - 'ground_station/**'
      - '.github/workflows/ground-station-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ground_station == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ground_station:
              - 'ground_station/**'
              - '.github/workflows/ground-station-tests.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Test Ground Station (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: ground_station/uv.lock

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
      working-directory: ground_station

    - name: Install dependencies
      run: uv sync --group dev
      working-directory: ground_station

    - name: Run tests with pytest
      run: uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term
      working-directory: ground_station

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        files: ./ground_station/coverage.xml
        flags: ground-station
        name: ground-station-coverage
        fail_ci_if_error: false

  test-compatibility:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Platform Compatibility Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: ground_station/uv.lock

    - name: Set up Python 3.11
      run: uv python install 3.11
      working-directory: ground_station

    - name: Install dependencies
      run: uv sync --group dev
      working-directory: ground_station

    - name: Run compatibility tests
      run: uv run pytest tests/test_compatibility.py -v
      working-directory: ground_station

    - name: Run filtering tests
      run: uv run pytest tests/test_filtering.py -v
      working-directory: ground_station

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    name: Lint Ground Station Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: ground_station/uv.lock

    - name: Set up Python 3.11
      run: uv python install 3.11
      working-directory: ground_station

    - name: Install linting tools
      run: uv tool install black==24.1.1 && uv tool install ruff==0.2.1

    - name: Check code formatting with black
      run: uv tool run black==24.1.1 --check --diff .
      working-directory: ground_station

    - name: Lint with ruff
      run: uv tool run ruff==0.2.1 check .
      working-directory: ground_station
